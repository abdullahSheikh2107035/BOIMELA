name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean verify

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        # Uses the Render Deploy Hook to trigger a deployment. 
        # You need to configure RENDER_DEPLOY_HOOK_URL in your GitHub repository secrets.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set!"
            echo "Please set it in your repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"


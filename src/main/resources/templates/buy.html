<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Purchases - Boimela</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; }
        nav { background: linear-gradient(135deg,#1a1a2e,#16213e); border-bottom: 1px solid #2a2a4a; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 1.5rem; font-weight: 700; color: #667eea; text-decoration: none; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #a0a0c0; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background: rgba(102,126,234,0.2); color: #667eea; }
        .logout-btn { padding: 8px 16px; background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        main { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 32px; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
        .stat-card { background: #161625; border: 1px solid #2a2a4a; border-radius: 12px; padding: 18px 20px; text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .stat-label { font-size: 0.78rem; color: #666; }
        .val-pending { color: #f59e0b; }
        .val-accepted { color: #10b981; }
        .val-rejected { color: #ef4444; }

        /* Purchase list */
        .purchase-list { display: flex; flex-direction: column; gap: 14px; }
        .purchase-card { background: #161625; border: 1px solid #2a2a4a; border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 20px; transition: border-color 0.2s; }
        .purchase-card:hover { border-color: #3a3a7a; }
        .purchase-icon { width: 52px; height: 52px; border-radius: 12px; background: rgba(102,126,234,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .purchase-info { flex: 1; }
        .purchase-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .purchase-seller { font-size: 0.82rem; color: #888; margin-bottom: 2px; }
        .purchase-price { font-size: 0.85rem; color: #10b981; font-weight: 600; }
        .status-badge { padding: 5px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
        .status-PENDING { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .status-ACCEPTED { background: rgba(16,185,129,0.15); color: #10b981; }
        .status-REJECTED { background: rgba(239,68,68,0.12); color: #ef4444; }
        .empty { text-align: center; padding: 60px 20px; color: #444; }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .go-buy { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 10px 22px; background: linear-gradient(135deg,#667eea,#764ba2); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
<nav>
    <a href="/dashboard" class="nav-brand">📚 Boimela</a>
    <div class="nav-links">
        <a href="/dashboard">🏠 Marketplace</a>
        <a href="/buy" class="active">🛒 My Purchases</a>
    </div>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</nav>

<main>
    <h1>🛒 My Purchases</h1>
    <p class="subtitle">Track all your purchase requests and their status.</p>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-val val-pending" id="cntPending">—</div>
            <div class="stat-label">⏳ Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-val val-accepted" id="cntAccepted">—</div>
            <div class="stat-label">✅ Accepted</div>
        </div>
        <div class="stat-card">
            <div class="stat-val val-rejected" id="cntRejected">—</div>
            <div class="stat-label">❌ Rejected</div>
        </div>
    </div>

    <div class="purchase-list" id="purchaseList">
        <div style="text-align:center;color:#555;padding:40px;">Loading your purchases...</div>
    </div>
</main>

<script>
    const statusEmoji = { PENDING: '⏳', ACCEPTED: '✅', REJECTED: '❌' };

    async function loadPurchases() {
        try {
            const res = await fetch('/api/purchases/my-purchases');
            if (!res.ok) {
                document.getElementById('purchaseList').innerHTML =
                    `<div class="empty">⛔ You need a BUYER role to view purchases.</div>`;
                return;
            }
            const purchases = await res.json();

            // Stats
            document.getElementById('cntPending').textContent = purchases.filter(p => p.status === 'PENDING').length;
            document.getElementById('cntAccepted').textContent = purchases.filter(p => p.status === 'ACCEPTED').length;
            document.getElementById('cntRejected').textContent = purchases.filter(p => p.status === 'REJECTED').length;

            const list = document.getElementById('purchaseList');
            if (purchases.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🛒</div>
                        <p>You haven't purchased any books yet.</p>
                        <a href="/dashboard" class="go-buy">🏠 Browse Books</a>
                    </div>`;
                return;
            }

            list.innerHTML = purchases.map(p => `
                <div class="purchase-card">
                    <div class="purchase-icon">📖</div>
                    <div class="purchase-info">
                        <div class="purchase-title">${esc(p.bookTitle)}</div>
                        <div class="purchase-seller">Seller: ${esc(p.sellerUsername)}</div>
                        <div class="purchase-price">৳${p.price ? p.price.toFixed(2) : '0.00'}</div>
                    </div>
                    <span class="status-badge status-${p.status}">${statusEmoji[p.status] || ''} ${p.status}</span>
                </div>
            `).join('');
        } catch(e) {
            document.getElementById('purchaseList').innerHTML =
                `<div class="empty">⚠️ Failed to load purchases.</div>`;
        }
    }

    function esc(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    loadPurchases();
</script>
</body>
</html>

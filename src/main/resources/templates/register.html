<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Book Exchange</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 300px; text-align: center; }
        h2 { margin-bottom: 1.5rem; color: #2196F3; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 4px; background: #333; color: white; }
        button { width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1e88e5; }
        a { color: #2196F3; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required/>
            <input type="email" id="email" placeholder="Email" required/>
            <input type="password" id="password" placeholder="Password" required/>
            <select id="role">
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>
            <button type="button" onclick="register()">Sign Up</button>
        </form>
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
    
    <script>
        function register() {
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                roles: [document.getElementById('role').value]
            };
            fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json().then(body => {
                if(res.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = '/login';
                } else {
                    alert('Registration failed: ' + (body.message || JSON.stringify(body)));
                }
            }));
        }
    </script>
</body>
</html>

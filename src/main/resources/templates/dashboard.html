<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Boimela Book Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; }

        /* Nav */
        nav {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #2a2a4a;
            padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
            height: 64px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .nav-brand { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #a0a0c0; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .nav-links a:hover { background: rgba(102,126,234,0.15); color: #667eea; }
        .nav-links a.active { background: rgba(102,126,234,0.2); color: #667eea; }
        .nav-user { display: flex; align-items: center; gap: 12px; }
        .user-badge { background: rgba(102,126,234,0.2); color: #667eea; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .logout-btn { padding: 8px 16px; background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .logout-btn:hover { background: rgba(239,68,68,0.25); }

        /* Main */
        main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

        /* Hero strip */
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid #2a2a4a; border-radius: 16px; padding: 36px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; }
        .hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .hero h1 span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #888; font-size: 0.95rem; }
        .hero-actions { display: flex; gap: 12px; flex-shrink: 0; }
        .btn-primary { padding: 10px 22px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(102,126,234,0.4); }
        .btn-secondary { padding: 10px 22px; background: rgba(102,126,234,0.12); color: #667eea; border: 1px solid rgba(102,126,234,0.3); border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-secondary:hover { background: rgba(102,126,234,0.2); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .stat-icon.purple { background: rgba(102,126,234,0.15); }
        .stat-icon.green { background: rgba(16,185,129,0.15); }
        .stat-icon.orange { background: rgba(245,158,11,0.15); }
        .stat-val { font-size: 1.8rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; color: #666; margin-top: 2px; }

        /* Section */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 600; }
        .section-hint { font-size: 0.85rem; color: #666; }

        /* Book grid */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .book-card {
            background: #161625; border: 1px solid #2a2a4a; border-radius: 14px; padding: 20px;
            transition: all 0.25s; cursor: default; display: flex; flex-direction: column;
        }
        .book-card:hover { border-color: #667eea; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(102,126,234,0.15); }
        .book-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; margin-bottom: 12px; width: fit-content; }
        .badge-available { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-sold { background: rgba(239,68,68,0.12); color: #ef4444; }
        .book-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
        .book-author { font-size: 0.82rem; color: #888; margin-bottom: 10px; }
        .book-desc { font-size: 0.83rem; color: #777; line-height: 1.5; flex: 1; margin-bottom: 14px; }
        .book-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 14px; border-top: 1px solid #2a2a4a; }
        .book-price { font-size: 1.2rem; font-weight: 700; color: #10b981; }
        .book-seller { font-size: 0.75rem; color: #555; }
        .btn-buy { padding: 7px 16px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
        .btn-buy:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-buy:disabled { background: #333; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Empty */
        .empty { text-align: center; padding: 60px 20px; color: #444; }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }

        /* Toast */
        #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; z-index: 9999; display: none; animation: slideIn 0.3s ease; max-width: 340px; }
        .toast-success { background: #065f46; color: #6ee7b7; border: 1px solid #059669; }
        .toast-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .loader { display: flex; gap: 8px; justify-content: center; padding: 40px; }
        .loader span { width: 10px; height: 10px; border-radius: 50%; background: #667eea; animation: bounce 0.8s infinite; }
        .loader span:nth-child(2) { animation-delay: 0.15s; }
        .loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,80%,100%{ transform: scale(0.6); opacity:0.4; } 40%{ transform: scale(1); opacity:1; } }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">📚 Boimela</div>
    <div class="nav-links" id="navLinks">
        <a href="/dashboard" class="active">🏠 Marketplace</a>
        <!-- JS will inject role-specific links -->
    </div>
    <div class="nav-user">
        <span class="user-badge" id="userBadge">Loading...</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</nav>

<main>
    <div class="hero">
        <div>
            <h1>Welcome to <span>Boimela</span></h1>
            <p>Discover, buy, and sell books in your community.</p>
        </div>
        <div class="hero-actions" id="heroActions"></div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-icon purple">📚</div>
            <div>
                <div class="stat-val" id="statTotal">—</div>
                <div class="stat-label">Books Listed</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div>
                <div class="stat-val" id="statAvailable">—</div>
                <div class="stat-label">Available Now</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">🛒</div>
            <div>
                <div class="stat-val" id="statMine">—</div>
                <div class="stat-label">Your Activity</div>
            </div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-title">📖 Available Books</div>
        <div class="section-hint" id="sectionHint"></div>
    </div>
    <div class="books-grid" id="booksGrid">
        <div class="loader"><span></span><span></span><span></span></div>
    </div>
</main>

<div id="toast"></div>

<script>
    const roles = [];
    let isBuyer = false, isSeller = false;

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = type === 'success' ? 'toast-success' : 'toast-error';
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    async function loadUserInfo() {
        try {
            const res = await fetch('/api/auth/me');
            if (!res.ok) return;
            const user = await res.json();
            document.getElementById('userBadge').textContent = `👤 ${user.username}`;

            user.roles.forEach(r => roles.push(r));
            isBuyer = roles.some(r => r.includes('BUYER'));
            isSeller = roles.some(r => r.includes('SELLER'));

            // Nav links
            const nav = document.getElementById('navLinks');
            if (isSeller) {
                nav.innerHTML += `<a href="/sell">📦 My Books</a><a href="/orders">📋 Orders</a>`;
            }
            if (isBuyer) {
                nav.innerHTML += `<a href="/buy">🛒 My Purchases</a>`;
            }

            // Hero actions
            const ha = document.getElementById('heroActions');
            if (isSeller) {
                ha.innerHTML += `<a href="/sell" class="btn-primary">+ List a Book</a>`;
            }
            if (isBuyer) {
                ha.innerHTML += `<a href="/buy" class="btn-secondary">📋 My Purchases</a>`;
            }

            document.getElementById('sectionHint').textContent =
                isBuyer ? 'Click "Buy" on any available book' : '';

            loadBooks();
        } catch(e) {
            loadBooks();
        }
    }

    async function loadBooks() {
        try {
            const res = await fetch('/api/books');
            const books = await res.json();
            document.getElementById('statTotal').textContent = books.length;
            document.getElementById('statAvailable').textContent = books.filter(b => b.available).length;

            const grid = document.getElementById('booksGrid');
            if (books.length === 0) {
                grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>No books available yet.</p></div>`;
                document.getElementById('statMine').textContent = '0';
                return;
            }

            // Count books belonging to current user (for sellers)
            const meRes = await fetch('/api/auth/me').catch(() => null);
            let myUsername = null;
            if (meRes && meRes.ok) {
                const me = await meRes.json().catch(() => null);
                if (me) myUsername = me.username;
            }

            let myCount = 0;
            grid.innerHTML = books.map(book => {
                const isMyBook = book.sellerUsername === myUsername;
                if (isMyBook) myCount++;
                const canBuy = isBuyer && book.available && !isMyBook;
                return `
                <div class="book-card">
                    <span class="book-badge ${book.available ? 'badge-available' : 'badge-sold'}">
                        ${book.available ? '✅ Available' : '🔴 Sold'}
                    </span>
                    <div class="book-title">${escHtml(book.title)}</div>
                    <div class="book-author">by ${escHtml(book.author)}</div>
                    <div class="book-desc">${escHtml(book.description || '')}</div>
                    <div class="book-footer">
                        <div>
                            <div class="book-price">৳${book.price ? book.price.toFixed(2) : '0.00'}</div>
                            <div class="book-seller">by ${escHtml(book.sellerUsername)}</div>
                        </div>
                        ${canBuy ? `<button class="btn-buy" onclick="buyBook(${book.id}, this)">🛒 Buy</button>` : ''}
                        ${isMyBook ? `<span style="font-size:0.75rem;color:#667eea;">Your listing</span>` : ''}
                        ${!book.available && !isMyBook ? `<span style="font-size:0.75rem;color:#666;">Unavailable</span>` : ''}
                    </div>
                </div>`;
            }).join('');
            document.getElementById('statMine').textContent = myCount || (isBuyer ? '—' : myCount);
        } catch(e) {
            document.getElementById('booksGrid').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><p>Failed to load books.</p></div>`;
        }
    }

    async function buyBook(bookId, btn) {
        btn.disabled = true;
        btn.textContent = 'Processing...';
        try {
            const res = await fetch(`/api/purchases/buy/${bookId}`, { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                showToast(`🎉 Purchase request sent! "${data.bookTitle}" — ৳${data.price.toFixed(2)}`);
                setTimeout(() => loadBooks(), 800);
            } else {
                showToast(data.message || 'Purchase failed.', 'error');
                btn.disabled = false;
                btn.textContent = '🛒 Buy';
            }
        } catch(e) {
            showToast('Network error. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = '🛒 Buy';
        }
    }

    function escHtml(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    loadUserInfo();
</script>
</body>
</html>

version: '3.8'

services:
  app:
    build: .
    container_name: boimela_app
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-boimela_db}
      - DB_USER=${POSTGRES_USER:-boimela_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-boimela_pass}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: boimela_db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-boimela_db}
      - POSTGRES_USER=${POSTGRES_USER:-boimela_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-boimela_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boimela_user} -d ${POSTGRES_DB:-boimela_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
